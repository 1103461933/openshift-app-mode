{{- $storageAccount := required "Set azure.storageAccountName in tenant values.yaml or with --set." .Values.azure.storageAccountName -}}
{{- $name := include "flink-application.fullname" . -}}
{{- $base := printf "%s/%s/%s" .Values.azure.basePath .Values.environment .Values.tenant -}}
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flink-application.labels" . | nindent 4 }}
spec:
  mode: native
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  flinkVersion: v2_2
  logConfiguration:
    log4j-console.properties: |-
      {{- .Files.Get "files/log4j-console.properties" | nindent 6 }}
  serviceAccount: flink
  flinkConfiguration:
    jobmanager.rpc.port: "6123"
    jobmanager.bind-host: "0.0.0.0"
    blob.server.port: "6124"
    rest.port: "8081"
    rest.bind-address: "0.0.0.0"
    taskmanager.numberOfTaskSlots: {{ .Values.flink.taskSlots | quote }}
    state.backend.type: rocksdb
    state.backend.rocksdb.localdir: /tmp/flink-rocksdb
    execution.checkpointing.incremental: "true"
    execution.checkpointing.interval: {{ .Values.flink.checkpointInterval | quote }}
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.timeout: {{ .Values.flink.checkpointTimeout | quote }}
    execution.checkpointing.min-pause: {{ .Values.flink.checkpointMinPause | quote }}
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    execution.checkpointing.tolerable-failed-checkpoints: "3"
    high-availability.type: kubernetes
    state.checkpoints.dir: abfs://openshift-checkpoints@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/checkpoints
    state.savepoints.dir: abfs://openshift-savepoints@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/savepoints
    high-availability.storageDir: abfs://openshift-ha@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/ha
    python.client.executable: /usr/bin/python3
    python.executable: /usr/bin/python3
    python.execution-mode: process
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "10 s"
    kubernetes.env.secretKeyRef: {{ printf "env:AZURE_STORAGE_ACCOUNT_NAME,secret:%s,key:azurestorageaccountname;env:AZURE_STORAGE_ACCOUNT_KEY,secret:%s,key:storage-account-key" .Values.azure.secretName .Values.azure.storageAccountKeySecretName | quote }}
    fs.azure.account.auth.type.flinkstorage911.dfs.core.windows.net: "SharedKey"
    fs.azure.account.key.flinkstorage911.dfs.core.windows.net: "${env.AZURE_STORAGE_ACCOUNT_KEY}"
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        lab.xle2911.com/tenant: {{ .Values.tenant | quote }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: flink-main-container
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: KAFKA_GROUP_ID
              value: {{ .Values.kafka.groupId | quote }}
            - name: SINK_MODE
              value: {{ .Values.couchbase.sinkMode | quote }}
            - name: COUCHBASE_CONNECTION_STRING
              value: {{ .Values.couchbase.connectionString | quote }}
            - name: COUCHBASE_BUCKET
              value: {{ .Values.couchbase.bucket | quote }}
            - name: COUCHBASE_SCOPE
              value: {{ .Values.couchbase.scope | quote }}
            - name: COUCHBASE_COLLECTION
              value: {{ .Values.couchbase.collection | quote }}
            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.couchbase.credentialsSecret }}
                  key: username
                  optional: true
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.couchbase.credentialsSecret }}
                  key: password
                  optional: true
  jobManager:
    replicas: {{ .Values.flink.jobManager.replicas }}
    resources:
      {{- toYaml .Values.flink.jobManager.resources | nindent 6 }}
  taskManager:
    resources:
      {{- toYaml .Values.flink.taskManager.resources | nindent 6 }}
  job:
    jarURI: {{ .Values.job.pythonJar | quote }}
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-pyclientexec"
      - "/usr/bin/python3"
      - "-py"
      - {{ .Values.job.pythonFile | quote }}
    parallelism: {{ .Values.flink.parallelism }}
    upgradeMode: {{ .Values.job.upgradeMode }}
    state: {{ .Values.job.state }}
