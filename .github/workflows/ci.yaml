name: Build and Push Flink Application Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (for example v1.1.0)"
        required: true
        type: string
        default: "v1.1.0"

permissions:
  contents: read

jobs:
  build-and-push:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "${DOCKERHUB_TOKEN}" || {
            echo "::error::Create repository secret DOCKERHUB_TOKEN"
            exit 1
          }
          [[ "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "::error::Invalid Docker image tag"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: xlen911
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./images/equipment-agregate
          file: ./images/equipment-agregate/Dockerfile
          platforms: linux/amd64
          push: true
          tags: xlen911/application-mode:${{ inputs.image_tag }}
          build-args: |
            FLINK_VERSION=2.2.0
            KAFKA_CONNECTOR_VERSION=5.0.0-2.2
