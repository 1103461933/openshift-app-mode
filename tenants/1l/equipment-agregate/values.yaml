flink-application:
  nameOverride: equipment-agregate
  environment: lab
  tenant: 1l
  image:
    repository: xlen911/application-mode
    tag: v1.1.7
    pullPolicy: IfNotPresent
    pullSecrets: []
  azure:
    secretName: azure-secret-st-flinkdata
    storageAccountKeySecretName: flink-storage-credentials
    storageAccountName: "flinkstorage911"
    haContainer: openshift-ha
    checkpointContainer: openshift-checkpoints
    savepointContainer: openshift-savepoints
    basePath: flink/application-mode
    haStorageDir: "abfs://openshift-ha@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/ha/recovery-20261124/equipment-agregate"
    checkpointDir: "abfs://openshift-checkpoints@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/checkpoints/recovery-20261124/equipment-agregate"
    savepointDir: "abfs://openshift-savepoints@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/savepoints/recovery-20261124/equipment-agregate"
  kafka:
    # Assumption for this PoC: Strimzi cluster lab-kafka in namespace kafka.
    # Replace only if your Kafka Service uses a different name/namespace.
    bootstrapServers: "lab-kafka-kafka-bootstrap.kafka.svc:9092"
    topic: equipment-events
    groupId: equipment-agregate-1l
  couchbase:
    sinkMode: console
    connectionString: "couchbase://couchbase.couchbase.svc"
    bucket: equipment
    scope: _default
    collection: events
    credentialsSecret: couchbase-credentials
  flink:
    taskSlots: 2
    parallelism: 2
    checkpointInterval: "30 s"
    checkpointTimeout: "5 min"
    checkpointMinPause: "5 s"
    jobManager:
      replicas: 1
      resources:
        requests:
          cpu: "100m"
          memory: "768Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
    taskManager:
      resources:
        requests:
          cpu: "1"
          memory: "1536Mi"
        limits:
          cpu: "1"
          memory: "2Gi"
  job:
    pythonFile: /opt/flink/usrlib/equipment_agregate.py
    pythonJar: local:///opt/flink/opt/flink-python-2.2.0.jar
    upgradeMode: savepoint
