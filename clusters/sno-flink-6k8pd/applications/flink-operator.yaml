apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-kubernetes-operator
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/1103461933/openshift-app-mode.git
    targetRevision: main
    path: platform/flink-operator
    helm:
      releaseName: flink-kubernetes-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: flink-operator
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
