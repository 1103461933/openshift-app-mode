---
# Source: equipment-agregate-1l/charts/flink-application/templates/flinkdeployment.yaml
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: equipment-agregate
  namespace: openshift-bridge-1l
  labels:
    app.kubernetes.io/name: equipment-agregate
    app.kubernetes.io/instance: equipment-agregate
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: openshift-app-mode-lab
    lab.xle2911.com/tenant: "1l"
    lab.xle2911.com/environment: "lab"
spec:
  mode: native
  image: "xlen911/application-mode:v1.1.7"
  imagePullPolicy: IfNotPresent
  flinkVersion: v2_2
  logConfiguration:
    log4j-console.properties: |-
      ################################################################################
      #  Licensed to the Apache Software Foundation (ASF) under one
      #  or more contributor license agreements.  See the NOTICE file
      #  distributed with this work for additional information
      #  regarding copyright ownership.  The ASF licenses this file
      #  to you under the Apache License, Version 2.0 (the
      #  "License"); you may not use this file except in compliance
      #  with the License.  You may obtain a copy of the License at
      #
      #      http://www.apache.org/licenses/LICENSE-2.0
      #
      #  Unless required by applicable law or agreed to in writing, software
      #  distributed under the License is distributed on an "AS IS" BASIS,
      #  WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
      #  See the License for the specific language governing permissions and
      # limitations under the License.
      ################################################################################
      
      # Allows this configuration to be modified at runtime. The file will be checked every 30 seconds.
      monitorInterval=30
      
      # This affects logging for both user code and Flink
      rootLogger.level = ${env:ROOT_LOG_LEVEL:-INFO}
      rootLogger.appenderRef.console.ref = ConsoleAppender
      rootLogger.appenderRef.rolling.ref = RollingFileAppender
      
      # Uncomment this if you want to _only_ change Flink's logging
      #logger.flink.name = org.apache.flink
      #logger.flink.level = INFO
      
      # The following lines keep the log level of common libraries/connectors on
      # log level INFO. The root logger does not override this. You have to manually
      # change the log levels here.
      logger.pekko.name = org.apache.pekko
      logger.pekko.level = INFO
      logger.kafka.name= org.apache.kafka
      logger.kafka.level = INFO
      logger.hadoop.name = org.apache.hadoop
      logger.hadoop.level = DEBUG
      logger.zookeeper.name = org.apache.zookeeper
      logger.zookeeper.level = INFO
      logger.shaded_zookeeper.name = org.apache.flink.shaded.zookeeper3
      logger.shaded_zookeeper.level = INFO
      
      # Log all infos to the console
      appender.console.name = ConsoleAppender
      appender.console.type = CONSOLE
      appender.console.layout.type = PatternLayout
      appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      appender.console.filter.threshold.type = ThresholdFilter
      appender.console.filter.threshold.level = ${sys:console.log.level:-ALL}
      
      # Log all infos in the given rolling file
      appender.rolling.name = RollingFileAppender
      appender.rolling.type = RollingFile
      appender.rolling.append = true
      appender.rolling.fileName = ${sys:log.file}
      appender.rolling.filePattern = ${sys:log.file}.%i
      appender.rolling.layout.type = PatternLayout
      appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      appender.rolling.policies.type = Policies
      appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
      appender.rolling.policies.size.size=100MB
      appender.rolling.policies.startup.type = OnStartupTriggeringPolicy
      appender.rolling.strategy.type = DefaultRolloverStrategy
      appender.rolling.strategy.max = ${env:MAX_LOG_FILE_NUMBER:-10}
      
      # Suppress the irrelevant (wrong) warnings from the Netty channel handler
      logger.netty.name = org.jboss.netty.channel.DefaultChannelPipeline
      logger.netty.level = OFF
      
      logger.azurekey.name = org.apache.hadoop.fs.azurebfs.services.SimpleKeyProvider
      logger.azurekey.level = DEBUG
      
  serviceAccount: flink
  flinkConfiguration:
    jobmanager.rpc.port: "6123"
    jobmanager.bind-host: "0.0.0.0"
    blob.server.port: "6124"
    rest.port: "8081"
    rest.bind-address: "0.0.0.0"
    taskmanager.numberOfTaskSlots: "2"
    state.backend.type: rocksdb
    state.backend.rocksdb.localdir: /tmp/flink-rocksdb
    execution.checkpointing.incremental: "true"
    execution.checkpointing.interval: "30 s"
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.timeout: "5 min"
    execution.checkpointing.min-pause: "5 s"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    execution.checkpointing.tolerable-failed-checkpoints: "3"
    high-availability.type: kubernetes
    state.checkpoints.dir: "abfs://openshift-checkpoints@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/checkpoints/recovery-20261124/equipment-agregate"
    state.savepoints.dir: "abfs://openshift-savepoints@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/savepoints/recovery-20261124/equipment-agregate"
    high-availability.storageDir: "abfs://openshift-ha@flinkstorage911.dfs.core.windows.net/flink/application-mode/lab/1l/ha/recovery-20261124/equipment-agregate"
    python.client.executable: /usr/bin/python3
    python.executable: /usr/bin/python3
    python.execution-mode: process
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "10 s"
    kubernetes.env.secretKeyRef: "env:AZURE_STORAGE_ACCOUNT_NAME,secret:azure-secret-st-flinkdata,key:azurestorageaccountname;env:AZURE_STORAGE_ACCOUNT_KEY,secret:flink-storage-credentials,key:storage-account-key"
    fs.azure.account.auth.type.flinkstorage911.dfs.core.windows.net: "SharedKey"
    fs.azure.account.key.flinkstorage911.dfs.core.windows.net: "${env.AZURE_STORAGE_ACCOUNT_KEY}"
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: equipment-agregate
        lab.xle2911.com/tenant: "1l"
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "lab-kafka-kafka-bootstrap.kafka.svc:9092"
            - name: KAFKA_TOPIC
              value: "equipment-events"
            - name: KAFKA_GROUP_ID
              value: "equipment-agregate-1l"
            - name: SINK_MODE
              value: "console"
            - name: COUCHBASE_CONNECTION_STRING
              value: "couchbase://couchbase.couchbase.svc"
            - name: COUCHBASE_BUCKET
              value: "equipment"
            - name: COUCHBASE_SCOPE
              value: "_default"
            - name: COUCHBASE_COLLECTION
              value: "events"
            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: couchbase-credentials
                  key: username
                  optional: true
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchbase-credentials
                  key: password
                  optional: true
  jobManager:
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 768Mi
  taskManager:
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: "1"
        memory: 1536Mi
  job:
    jarURI: "local:///opt/flink/opt/flink-python-2.2.0.jar"
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-pyclientexec"
      - "/usr/bin/python3"
      - "-py"
      - "/opt/flink/usrlib/equipment_agregate.py"
    parallelism: 2
    upgradeMode: savepoint
    state: running
